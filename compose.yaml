services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - angar-mongo:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --host
        - 127.0.0.1
        - --eval
        - >-
          try { rs.status(); }
          catch (err) {
            if (err.code !== 94) quit(1);
            rs.initiate({_id:"rs0", members:[{_id:0, host:"localhost:27017"}]});
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
      interval: 4s
      timeout: 5s
      retries: 25
      start_period: 5s
volumes:
  angar-mongo:
